apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nico-provisioner-metal3.name" . }}
  namespace: {{ include "nico-provisioner-metal3.namespace" . }}
  labels:
    {{- include "nico-provisioner-metal3.labels" . | nindent 4 }}
---
{{- if .Values.rbac.create }}
# ClusterRole grants access to BareMetalHost CRs (cluster-scoped to allow
# managing machines across namespaces) and Secrets for BMC credentials.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nico-provisioner-metal3.name" . }}
  labels:
    {{- include "nico-provisioner-metal3.labels" . | nindent 4 }}
rules:
  - apiGroups: ["metal3.io"]
    resources: ["baremetalhosts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nico-provisioner-metal3.name" . }}
  labels:
    {{- include "nico-provisioner-metal3.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nico-provisioner-metal3.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nico-provisioner-metal3.name" . }}
    namespace: {{ include "nico-provisioner-metal3.namespace" . }}
{{- end }}
{{- if and .Values.rbac.create .Values.customIPA.enabled }}
---
# ClusterRole and binding for patching the cluster-scoped Provisioning CR.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nico-provisioner-metal3.name" . }}-provisioning
  labels:
    {{- include "nico-provisioner-metal3.labels" . | nindent 4 }}
rules:
  - apiGroups: ["metal3.io"]
    resources: ["provisionings"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nico-provisioner-metal3.name" . }}-provisioning
  labels:
    {{- include "nico-provisioner-metal3.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nico-provisioner-metal3.name" . }}-provisioning
subjects:
  - kind: ServiceAccount
    name: {{ include "nico-provisioner-metal3.name" . }}
    namespace: {{ include "nico-provisioner-metal3.namespace" . }}
{{- end }}
