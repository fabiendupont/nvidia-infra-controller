global:
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: image-pull-secret
  certificate:
    issuerRef:
      kind: ClusterIssuer
      name: carbide-rest-ca-issuer
      group: cert-manager.io

replicaCount: 1

nameOverride: ""
namespaceOverride: ""

image:
  # Set to an image name when global.image.repository is empty (e.g. local Kind dev).
  name: nico-switch-config-provider
  # Override image.name with a fully qualified image reference for standalone use.
  override: ""

service:
  name: nico-switch-config-provider
  type: ClusterIP
  port: 9443

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"

certificate:
  enabled: true
  name: nico-switch-config-provider-certs
  secretName: nico-switch-config-provider-certs
  duration: 720h
  renewBefore: 360h
  subject:
    organizations: []
  privateKey:
    algorithm: ECDSA
    size: 384
  uris: []

# Environment variables passed to the provider container.
envConfig:
  LISTEN_ADDR: ":9443"
  # DB_HOST, DB_PORT, DB_NAME, DB_USER set these for persistent fault storage.
  # DB_PASSWORD should come from a Secret (see db.passwordSecretName).

db:
  host: ""
  port: "5432"
  name: "nico"
  user: "nico"
  # Name of a Secret with key "password" holding the DB password.
  passwordSecretName: ""

temporal:
  endpoint: ""
  namespace: "default"

db:
  host: ""
  port: 5432
  name: nico
  user: nico
  passwordSecret: ""

temporal:
  endpoint: ""
  namespace: default

# comma-separated site UUIDs this provider manages
siteIds: ""

switch:
  # platform selects the switch vendor configurator.
  # "spectrum"/"nvos": NVIDIA Spectrum switches via NVUE REST API (default).
  # "nvlink": NVLink fabric switches — not yet implemented (managed by NICo Core via NMX-C).
  platform: "spectrum"
  # insecureTLS skips TLS verification when connecting to the switch NVUE API.
  # Set true only in dev/lab environments with self-signed switch certs.
  insecureTLS: false
  # credentials for the switch NVUE API (SWITCH_USERNAME / SWITCH_PASSWORD env vars).
  # Production: use a Vault-backed secret and set credential_ref on the NicoSwitch object.
  credentialsSecret: ""  # Kubernetes Secret name with username/password keys
