apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nico-showback-provider.name" . }}
  namespace: {{ include "nico-showback-provider.namespace" . }}
  labels:
    {{- include "nico-showback-provider.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nico-showback-provider.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nico-showback-provider.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: showback-provider
          image: "{{ include "nico-showback-provider.image" . }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: grpc
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "nico-showback-provider.name" . }}
          env:
            - name: CERTDIR
              value: /var/run/secrets/spiffe.io
            {{- if .Values.db.passwordSecretName }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.db.passwordSecretName }}"
                  key: password
            {{- end }}
          {{- if .Values.certificate.enabled }}
          volumeMounts:
            - name: tls-certs
              mountPath: /var/run/secrets/spiffe.io
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
      {{- if .Values.certificate.enabled }}
      volumes:
        - name: tls-certs
          secret:
            secretName: {{ .Values.certificate.secretName }}
      {{- end }}
