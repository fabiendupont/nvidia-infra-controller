apiVersion: v1
kind: Service
metadata:
  name: {{ include "nico-networking-provider.name" . }}
  namespace: {{ include "nico-networking-provider.namespace" . }}
  labels:
    {{- include "nico-networking-provider.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: grpc
      protocol: TCP
  selector:
    {{- include "nico-networking-provider.selectorLabels" . | nindent 4 }}
