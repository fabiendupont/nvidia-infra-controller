# TLS certificate for the NICo Core gRPC server, issued by cert-manager.
# Uses ECDSA P-256 keys — Rustls (the TLS library used by NICo Core) requires
# ECDSA; RSA keys cause the TLS acceptor to fail silently.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nico-core-grpc-server-cert
  namespace: nico-rest
spec:
  secretName: nico-rest-core-grpc-certs
  issuerRef:
    name: nico-rest-ca-issuer
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - nico-core
    - nico-core.nico-rest
    - nico-core.nico-rest.svc
    - nico-core.nico-rest.svc.cluster.local
  usages:
    - server auth
    - client auth
