apiVersion: v1
kind: Service
metadata:
  name: nico-core
  namespace: nico-rest
  labels:
    app.kubernetes.io/name: nico-core
spec:
  selector:
    app: nico-core
  ports:
    - port: 1079
      name: grpc
      targetPort: 1079
    - port: 1080
      name: metrics
      targetPort: 1080
